<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 260" fill="none">
  <!-- Background -->
  <rect width="480" height="260" rx="16" fill="#0e2e30"/>

  <!-- Grid lines -->
  <line x1="40" y1="60"  x2="440" y2="60"  stroke="#1a4545" stroke-width="1"/>
  <line x1="40" y1="100" x2="440" y2="100" stroke="#1a4545" stroke-width="1"/>
  <line x1="40" y1="140" x2="440" y2="140" stroke="#1a4545" stroke-width="1"/>
  <line x1="40" y1="180" x2="440" y2="180" stroke="#1a4545" stroke-width="1"/>

  <!-- BENIGN traffic line (calm, low) -->
  <polyline
    points="40,175 90,170 140,172 190,168 240,171 290,167 340,170 390,169 440,168"
    stroke="#66BFBF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- BENIGN area fill -->
  <polygon
    points="40,175 90,170 140,172 190,168 240,171 290,167 340,170 390,169 440,168 440,210 40,210"
    fill="url(#benignGrad)" opacity="0.4"/>

  <!-- DDoS spike line (dramatic) -->
  <polyline
    points="40,165 70,155 100,80 115,55 130,62 150,100 180,130 220,120 260,115 300,118 340,116 390,114 440,113"
    stroke="#11cdd4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- DDoS area fill -->
  <polygon
    points="40,165 70,155 100,80 115,55 130,62 150,100 180,130 220,120 260,115 300,118 340,116 390,114 440,113 440,210 40,210"
    fill="url(#ddosGrad)" opacity="0.25"/>

  <!-- Spike annotation marker -->
  <circle cx="115" cy="55" r="5" fill="#11cdd4"/>
  <line x1="115" y1="50" x2="115" y2="20" stroke="#11cdd4" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="72" y="4" width="86" height="20" rx="5" fill="#11cdd4" opacity="0.15"/>
  <text x="115" y="18" text-anchor="middle" fill="#66BFBF" font-family="Inter, sans-serif" font-size="10" font-weight="600">DDoS Spike</text>

  <!-- Shield icon (top right) -->
  <g transform="translate(382,18)">
    <path d="M29 4 L50 12 L50 28 C50 40 40 50 29 54 C18 50 8 40 8 28 L8 12 Z" fill="#11999E" opacity="0.9"/>
    <polyline points="20,31 27,38 40,23" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Legend -->
  <circle cx="56" cy="228" r="5" fill="#66BFBF"/>
  <text x="66" y="232" fill="#66BFBF" font-family="Inter, sans-serif" font-size="11">BENIGN Traffic</text>
  <circle cx="180" cy="228" r="5" fill="#11cdd4"/>
  <text x="190" y="232" fill="#11cdd4" font-family="Inter, sans-serif" font-size="11">DDoS Traffic</text>

  <!-- Accuracy badge -->
  <rect x="318" y="214" width="122" height="34" rx="8" fill="#11999E" opacity="0.15"/>
  <text x="379" y="229" text-anchor="middle" fill="#66BFBF" font-family="Inter, sans-serif" font-size="10">Random Forest</text>
  <text x="379" y="243" text-anchor="middle" fill="#11cdd4" font-family="Inter, sans-serif" font-size="12" font-weight="700">99.99% Accuracy</text>

  <!-- Y-axis label -->
  <text x="16" y="135" fill="#2a5c5c" font-family="Inter, sans-serif" font-size="9" transform="rotate(-90,16,135)">Packet Flow</text>

  <!-- Gradients -->
  <defs>
    <linearGradient id="benignGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BFBF"/>
      <stop offset="100%" stop-color="#66BFBF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ddosGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11cdd4"/>
      <stop offset="100%" stop-color="#11cdd4" stop-opacity="0"/>
    </linearGradient>
  </defs>
</svg>
